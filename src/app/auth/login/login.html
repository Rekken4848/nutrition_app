<div class="login-container">
  <div class="logo">
    <h1>🍎 NutriTrack</h1>
    <p>Welcome back!</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="text" id="email" formControlName="email" placeholder="Enter your email" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-container">
        <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
          placeholder="Enter your password" required />
        <button type="button" class="password-toggle" (click)="togglePassword()">
          {{ showPassword ? '🙈' : '👁️' }}
        </button>
      </div>
      <div class="forgot-password">
        <a routerLink="/forgot-password">Forgot Password?</a>
      </div>
    </div>

    <button type="submit" class="btn" [disabled]="loading || loginForm.invalid">
      {{ loading ? 'Signing In...' : 'Sign In' }}
    </button>
  </form>

  <div class="divider">
    <span>or continue with</span>
  </div>

  <div class="social-login">
    <button class="social-btn" (click)="socialLogin('Google')">📧 Google</button>
    <button class="social-btn" (click)="socialLogin('Facebook')">📘 Facebook</button>
  </div>

  <div class="links">
    <a routerLink="/register">Create Account</a>
    <a routerLink="/help">Need Help?</a>
  </div>
</div>
